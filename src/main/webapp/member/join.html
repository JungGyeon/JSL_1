<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会員登録 — ANIVERSE</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
</head>
<body>

<!-- ===== NAV ===== -->
<nav class="navbar navbar-expand-md navbar-custom py-3">
  <div class="container">
    <a class="navbar-brand brand" href="../index.html">ANI<span>VERSE</span></a>
    <div class="d-flex align-items-center gap-2 order-md-3">
      <button class="spec-toggle" id="specToggleBtn" onclick="toggleSpec()" title="画面に要件ID(例: USER-001)を表示します">⌘ 仕様書オーバーレイ</button>
      <a class="btn btn-outline-soft btn-sm" href="../login/login.html">ログイン</a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" style="filter:invert(1);">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>
    <div class="collapse navbar-collapse order-md-2" id="navMain">
      <ul class="navbar-nav mx-md-3 gap-1 mt-3 mt-md-0">
        <li class="nav-item"><a class="nav-link nav-link-custom" href="../index.html">ホーム</a></li>
        <li class="nav-item"><a class="nav-link nav-link-custom" href="../list/list.html">アニメ一覧</a></li>
        <li class="nav-item"><a class="nav-link nav-link-custom" href="../recommend/recommend.html">おすすめ</a></li>
        <li class="nav-item"><a class="nav-link nav-link-custom" href="../mypage/mypage.html">マイページ</a></li>
      </ul>
    </div>
  </div>
</nav>

<section class="section container req-anchor" style="max-width:480px;">
  <span class="req-id">USER-001 · USER-002 · USER-003 · USER-004</span>
  <div class="surface p-4 p-md-5">
    <h3 class="text-center mb-1">会員登録</h3>
    <p class="text-muted text-center mb-4 small">いくつかの情報を入力するだけで、すぐに始められます</p>

    <!-- 실제 구현 시 action="JoinServlet" method="post"로 교체 -->
    <form id="joinForm" onsubmit="return handleJoin(event)">
      <div class="mb-3">
        <label class="form-label-custom">ID</label>
        <div class="d-flex gap-2">
          <input type="text" class="form-control form-control-custom" name="userId" id="joinId" placeholder="IDを入力">
          <button class="btn btn-outline-soft flex-shrink-0" type="button" onclick="checkDup()">重複確認</button>
        </div>
        <div class="small mt-1" id="dupResult"></div>
      </div>
      <div class="mb-3">
        <label class="form-label-custom">パスワード</label>
        <input type="password" class="form-control form-control-custom" name="userPw" id="joinPw" placeholder="パスワードを入力">
      </div>
      <div class="mb-3">
        <label class="form-label-custom">パスワード確認</label>
        <input type="password" class="form-control form-control-custom" id="joinPwCheck" placeholder="パスワードを再入力">
      </div>
      <div class="mb-3">
        <label class="form-label-custom">ニックネーム</label>
        <input type="text" class="form-control form-control-custom" name="nickname" id="joinNick" placeholder="ニックネームを入力">
      </div>
      <div class="mb-4">
        <label class="form-label-custom">メールアドレス</label>
        <input type="email" class="form-control form-control-custom" name="email" id="joinEmail" placeholder="you@example.com">
      </div>
      <div id="joinError" class="alert alert-danger py-2 small d-none" style="background:#3a1a22;border:1px solid #6b2532;color:#ffb4c0;"></div>
      <button class="btn btn-accent w-100" type="submit">登録する</button>
    </form>
  </div>
</section>

<footer class="footer text-center req-anchor">
  <span class="req-id" style="position:static; display:inline-block; margin-bottom:.5rem;">SYS-002</span>
  <div>ANIVERSE — アニメおすすめサイト プロジェクト · JSP + Oracle + Bootstrap</div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="../js/anime-data.js"></script>
<script>
  // 데모: "admin"만 중복 아이디로 처리 (USER-002 아이디 중복확인)
  function checkDup(){
    const id = document.getElementById("joinId").value.trim();
    const res = document.getElementById("dupResult");
    if(!id){ res.innerHTML = '<span style="color:#ffb4c0;">IDを入力してください。</span>'; return; }
    if(id.toLowerCase()==="admin"){
      res.innerHTML = '<span style="color:#ffb4c0;">すでに使用されているIDです。</span>';
    }else{
      res.innerHTML = '<span style="color:var(--accent-2);">使用可能なIDです。</span>';
    }
  }

  // 실제 구현 시 서버(JoinServlet)에서 USER 테이블 INSERT 후 로그인 세션 생성 (USER-001~004)
  function handleJoin(e){
    e.preventDefault();
    const id = document.getElementById("joinId").value.trim();
    const pw = document.getElementById("joinPw").value;
    const pw2 = document.getElementById("joinPwCheck").value;
    const nick = document.getElementById("joinNick").value.trim();
    const email = document.getElementById("joinEmail").value.trim();
    const err = document.getElementById("joinError");
    let msg = "";
    if(!id||!pw||!pw2||!nick||!email) msg = "すべての項目を入力してください。";
    else if(pw!==pw2) msg = "パスワードが一致しません。";
    if(msg){ err.textContent = msg; err.classList.remove("d-none"); return false; }
    err.classList.add("d-none");
    location.href = "../mypage/mypage.html?nick=" + encodeURIComponent(nick);
    return false;
  }
</script>
</body>
</html>
