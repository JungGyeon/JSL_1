<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="../js/anime-data.js"></script>
<script>
  /*
    백엔드 연동 전 목업이므로 로그인 여부를 알 수 없습니다.
    데모를 위해 마이페이지와 동일한 찜 목록(DEMO_FAV_IDS)이 있다고 가정하고 추천을 계산합니다.
    실제 구현 시 로그인 세션 + FAVORITE 테이블 기반으로 교체 (REC-001~003)
  */
  function onFavClick(id){ location.href = "../login/login.html"; }

  const DEMO_FAV_IDS = [1, 4, 8];
  const favs = ANIME.filter(a => DEMO_FAV_IDS.includes(a.id));
  const favTagSet = new Set(favs.flatMap(a => a.tags));
  const favIds = new Set(favs.map(a => a.id));

  const scored = ANIME.filter(a => !favIds.has(a.id))
    .map(a => ({ a, overlap: a.tags.filter(t => favTagSet.has(t)).length }))
    .filter(x => x.overlap > 0)
    .sort((x, y) => y.overlap - x.overlap || y.a.score - x.a.score);

  document.getElementById("recommendSub").textContent =
    `お気に入り${favs.length}作品のタグ(${[...favTagSet].slice(0,5).join("、")}${favTagSet.size>5?" など":""})に基づいておすすめします。`;

  document.getElementById("recommendGrid").innerHTML = scored.length
    ? scored.map(x => cardHTML(x.a, "../detail/detail.html", false)).join("")
    : `<div class="col-12"><div class="empty-state">現在のお気に入りと重なるタグの作品がありません。</div></div>`;
</script>
